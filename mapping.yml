# mapping.yml — exemple ADEME (équivalent de la Phase 1 POC)
# Doit produire le même rendu que les screenshots dans visual-references/

version: 1
dsfr: "1.14.4"

typography:
  primary:
    css-name: "Marianne"               # nom CSS conservé pour ne pas casser les var(--font-family)
    files-source: "./assets/fonts/"
    weights:
      "300": { normal: "PublicSans-Light",   italic: "PublicSans-LightItalic" }
      "400": { normal: "PublicSans-Regular", italic: "PublicSans-Italic" }
      "500": { normal: "PublicSans-Medium",  italic: "PublicSans-MediumItalic" }
      "700": { normal: "PublicSans-Bold",    italic: "PublicSans-BoldItalic" }
  alt: keep                            # Spectral conservée

colors:
  blue-france:
    rename: blue-ate
    anchor:
      hex: "#4950FB"
    generation: lch-remap
    recalibrate-grade:
      main-525: main-444               # L*=44.4 → numéro de grade aligné
      sun-113: sun-157                 # même logique sur sun
    wcag:
      sun-157: { min: 4.5, against: "#ffffff" }
      main-444: { min: 3.0, against: "#ffffff" }
      "625":   { min: 4.5, against: "#1e1e1e" }

  red-marianne:
    rename: red-laura
    anchor:
      hex: "#FF3333"
    generation: lch-remap
    add-grades:
      sun-157: { L: 15.7, c-factor: 1.10 }   # red n'avait pas de sun explicite en DSFR
    recalibrate-grade:
      main-472: main-560
    semantic-remap:
      red-marianne-425: red-marianne-sun-157  # 425 jouait le rôle "sun" sans le nom
    wcag:
      sun-157: { min: 4.5, against: "#ffffff" }
      main-560: { min: 3.0, against: "#ffffff" }
      "625":    { min: 4.5, against: "#1e1e1e" }

elevation:
  shadow-color:
    light: "rgba(0, 0, 0, 0.16)"
    dark:  "rgba(0, 0, 0, 0.32)"

border-radius:
  base: "0.75rem"
  targets:
    - { selector: ".fr-input",       value: "0.75rem" }
    - { selector: ".fr-select",      value: "0.75rem" }
    - { selector: ".fr-btn",         value: "0.75rem" }
    - { selector: ".fr-badge",       value: "0.75rem" }
    - { selector: ".fr-card",        value: "0.75rem", overflow: true }
    - { selector: ".fr-alert",       value: "0.75rem", overflow: true }   # gradients en background → overflow hidden requis pour clipper la barre 40px gauche
    - { selector: ".fr-input-wrap--addon > *:first-child:not(:last-child)", value: "0.75rem 0 0 0.75rem" }
    - { selector: ".fr-input-wrap--addon > *:last-child:not(:first-child)", value: "0 0.75rem 0.75rem 0" }

manual-overrides:
  - "./overrides/_card-fix.scss"       # box-shadow inset trick pour bordure radius

icons:
  # Remplace les SVG DSFR-specific (préfixe fr--*) par leurs équivalents Lucide.
  # Le contenu du fichier change, le nom de classe DSFR (.fr-icon-fr--success-fill)
  # ne bouge pas — les composants continuent de marcher. Les ~999 icones Remix
  # de DSFR (déjà MIT, pas État-specific) restent telles quelles.
  overrides:
    fr--success-fill: circle-check
    fr--success-line: circle-check
    fr--warning-fill: triangle-alert
    fr--warning-line: triangle-alert
    fr--error-fill:   circle-x
    fr--error-line:   circle-x
    fr--info-fill:    info
    fr--info-line:    info
    fr--accessibility-fill: accessibility
    fr--accessibility-line: accessibility
    # Reste à mapper si besoin (lucide.dev a probablement un équivalent) :
    #   fr--bold, fr--highlight, fr--quote-fill, fr--quote-line,
    #   fr--alert-warning-fill, fr--alert-warning-2-fill,
    #   fr--ear-off-*, fr--sign-language-*, fr--mental-disabilities-*,
    #   fr--avalanches-*, fr--submersion-*, fr--capslock-line,
    #   fr--equal-circle-fill, fr--theme-fill, fr--dailymotion-*, fr--tiktok-*,
    #   fr--arrow-left-s-first-line, fr--arrow-left-s-line-double,
    #   fr--arrow-right-s-last-line, fr--arrow-right-s-line-double

  # Ajoute des icones Lucide accessibles via .fr-icon-<token>. Format court
  # = string (le token sera = au nom Lucide). Format long pour les alias.
  add:
    - flame                          # → .fr-icon-flame, source = lucide flame.svg
    - leaf                           # → .fr-icon-leaf
    - { token: ademe-pin, name: map-pin }  # alias custom

components:
  remove:
    - header
    - footer

post-process:
  rename:
    enabled: true
    safety-check: true
