name: upstream-drift

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: git submodule update --remote dsfr
      - id: validate
        run: npm run validate
        continue-on-error: true
      - if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream DSFR drift detected';
            const body = 'The weekly drift check found changes in upstream DSFR ' +
                         'that may affect the override builder. Run npm run validate ' +
                         'locally and update .ademe-baseline.json once verified.';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['drift']
            });
            if (open.data.find(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['drift']
            });
