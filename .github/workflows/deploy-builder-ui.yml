name: deploy-builder-ui

on:
  push:
    branches: [main]
    paths:
      - 'builder-ui/**'
      - 'builder/**'
      - 'mapping.yml*'
      - 'overrides/**'
      - 'scripts/build-*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-builder-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule release Pages à la fois ; un nouveau push annule un déploiement
# en cours pour que ce soit le dernier commit qui finisse en prod.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` produit `dist/` (CSS DSFR-override, fonts, JS DSFR
      # vendor, icônes copiées). Doit tourner avant `build:pages` qui
      # consomme `dist/`.
      - run: pnpm build

      # `pnpm build:pages` assemble `_site/` complet :
      # bundle UI + page témoin + dist + snapshots API + SVG icônes.
      # Iso à l'expérience dev.
      - run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
