<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSFR Override — builder UI</title>
  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
    {
      "imports": {
        "yaml": "/builder-ui/node_modules/yaml/browser/index.js",
        "hljs/core": "https://esm.sh/highlight.js@11.11.1/lib/core",
        "hljs/yaml": "https://esm.sh/highlight.js@11.11.1/lib/languages/yaml",
        "ademe-lch": "/builder/lch.js",
        "ademe-palette": "/builder/generate/palette.js",
        "ademe-profile": "/builder/generate/profile-lch.js"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <strong>DSFR Override — Builder UI</strong>
    <span class="topbar__sub">config par défaut : ADEME</span>
    <span class="topbar__spacer"></span>
    <button id="btn-load">Charger mapping.yml…</button>
    <input type="file" id="file-input" accept=".yml,.yaml" hidden>
    <button id="btn-reset">Reset défaut</button>
    <button id="btn-export" class="btn-primary">Exporter mapping.yml</button>
  </header>

  <!-- Fonts autocomplete: populated at boot from ../__api/fonts.json. -->
  <datalist id="list-font-files"></datalist>
  <!-- Icons autocomplete: populated at boot from ../__api/icons/{dsfr,lucide}.json. -->
  <datalist id="list-dsfr-icons"></datalist>
  <datalist id="list-lucide-icons"></datalist>
  <!-- Singleton tooltip — positioned in JS on hover/focus of any .help button. -->
  <div id="help-popup" hidden></div>

  <main class="layout">
    <aside class="settings" aria-label="Réglages">
      <!-- Sections injectées par main.js -->
    </aside>

    <section class="preview" aria-label="Aperçu">
      <div class="preview__bar">
        <span class="label">Vue</span>
        <div class="segmented" role="group" aria-label="Mode preview">
          <button data-mode="example" class="active" aria-pressed="true">Témoin</button>
          <button data-mode="gallery" aria-pressed="false">Galerie</button>
          <button data-mode="palette" aria-pressed="false">Palette LCh</button>
        </div>
        <span class="label">Thème</span>
        <div class="segmented" role="group" aria-label="Thème de l'aperçu">
          <button data-theme="auto" class="active" aria-pressed="true" title="Suit prefers-color-scheme">Auto</button>
          <button data-theme="light" aria-pressed="false">Light</button>
          <button data-theme="dark"  aria-pressed="false">Dark</button>
        </div>
      </div>
      <iframe id="preview-frame" src="../example/index.html" title="Aperçu"></iframe>
      <div id="palette-view" class="palette-view" hidden></div>
    </section>

    <aside class="yaml" aria-label="YAML brut">
      <div class="yaml__header">
        <span>mapping.yml</span>
        <span id="yaml-status" class="yaml__status"></span>
      </div>
      <div class="yaml__editor-wrap">
        <pre id="yaml-hl" aria-hidden="true"></pre>
        <textarea id="yaml-editor" spellcheck="false"></textarea>
      </div>
    </aside>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
